services:
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      MAX_PAGES: ${MAX_PAGES:-20}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    working_dir: /app
    environment:
      ONECLICK_API_URL: http://backend:8000/api
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
